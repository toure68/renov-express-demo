name: Vérifications Rénov'Express V2
on:
  push:
    branches:
      - 'fix/v2-*'
  pull_request:
    branches:
      - renov-express-v2
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript V2
        run: |
          node --check v2/app.js
          node --check v2/workflow.js
          node --check v2/calc.js
          node --check v2/pdf.js
          node --check v2/pdf-share.js
          node --check v2/invoice.js
          node --check v2/storage-tools.js
          node --check v2/context-flow.js
      - name: Vérifier les calculs existants
        run: node tests/test_calculs.js
      - name: Vérifier le workflow V2
        run: node tests/test_workflow_v2.js
      - name: Vérifier le parcours contextuel
        run: node tests/test_context_flow_v2.js
      - name: Vérifier les factures et sauvegardes locales
        run: node tests/test_invoice_v2.js
      - name: Vérifier les contrats UI CCTP
        run: node tests/test_cctp_ui.js

  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium de test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Recette navigateur (ordinateur + téléphone simulé + avion)
        run: node tests/browser_v2.js
      - name: Publier le rapport d’essais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-navigateur-v2
          path: tests/browser-results.json
          if-no-files-found: ignore
