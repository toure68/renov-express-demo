<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F4E5F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rénov’Express"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>Rénov’Express · Devis</title><style>
  :root{
    --bg-top:#13265a; --bg-mid:#060b18; --bg-low:#04070f; --glow:#0d4a37;
    --ink:#ffffff; --muted:#a9b3c7; --muted2:#b9c1d1;
    --card:rgba(255,255,255,.055); --card-line:rgba(255,255,255,.11);
    --hero:rgba(44,72,140,.38); --hero-line:rgba(120,150,220,.28);
    --green:#5fe3a6; --mic:#1fa774; --mic-ring:rgba(31,167,116,.28);
    --amber:#f1c24a; --amber-bg:rgba(241,194,74,.16);
    --ok-bg:rgba(95,227,166,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{background:#04070f}
  body{background:#04070f;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;padding:0}
  .phone{position:relative;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden;
    background:
      radial-gradient(120% 55% at 85% 88%, rgba(13,90,62,.55) 0%, rgba(13,74,55,.18) 45%, transparent 70%),
      linear-gradient(180deg,var(--bg-top) 0%, #0c1838 18%, var(--bg-mid) 52%, var(--bg-low) 100%);
    padding:calc(env(safe-area-inset-top) + 26px) calc(env(safe-area-inset-right) + 17px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 17px)}
  @media (min-width:500px){
    :root{--app-w:375px}
    html,body{background:#1b1b1b}
    body{padding:24px 0}
    .phone{max-width:375px;min-height:806px;border-radius:52px;border:1px solid rgba(255,255,255,.08)}
  }
  header{display:flex;justify-content:space-between;align-items:flex-start}
  .hello{font-size:14px;color:var(--muted);letter-spacing:.1px}
  .name{font-size:24px;font-weight:800;letter-spacing:-.2px;margin-top:3px}
  .bell{width:42px;height:42px;border-radius:50%;background:rgba(10,16,32,.55);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;cursor:pointer}
  .hero{margin-top:16px;border-radius:24px;padding:20px 18px 19px;background:linear-gradient(160deg,rgba(40,66,135,.55),rgba(22,36,78,.45));border:1px solid var(--hero-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .hero .lbl{font-size:13px;color:var(--muted2)}
  .hero .amount{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1;margin:13px 0 15px}
  .hero .paid{font-size:13px;color:var(--muted2)}
  .hero .paid b{color:var(--green);font-weight:700}
  .hero.vedette{padding:16px 16px 14px;cursor:pointer}
  .hero.vedette.alerte{border-color:rgba(255,107,107,.38);background:linear-gradient(160deg,rgba(120,40,60,.45),rgba(30,30,70,.5))}
  .hv-t{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hv-t .lbl{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--green)}
  .hero.alerte .hv-t .lbl{color:#ff9b9b}
  .hv-t .demo{margin-top:0;font-size:10.5px;padding:2px 8px}
  .hv-d{display:flex;align-items:flex-start;gap:12px;margin-top:12px}
  .hv-d .bt{--sz:44px}
  .hv-m{flex:1;min-width:0}.hv-m b{display:block;font-size:15.5px;font-weight:800}
  .hv-m span{display:block;font-size:13px;color:var(--muted2);line-height:1.4;margin-top:4px}
  .hv-v{font-size:22px;font-weight:900;letter-spacing:-.4px;white-space:nowrap}
  .hv-go{margin-top:14px;height:46px}
  .hv-tot{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}.hv-tot b{color:var(--green);font-weight:700}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .act{height:114px;border-radius:20px;background:var(--card);border:1px solid var(--card-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .act:active{transform:scale(.98)}
  .mic{width:62px;height:62px;border-radius:50%;background:var(--mic-ring);display:grid;place-items:center;margin-top:-4px}
  .mic span{width:50px;height:50px;border-radius:50%;background:var(--mic);display:grid;place-items:center}
  .camw{width:62px;height:62px;display:grid;place-items:center;margin-top:-4px}
  .cam{width:53px;height:53px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#0a0f1d}
  h2{font-size:15px;font-weight:700;margin:18px 0 10px}
  .list{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;justify-content:space-between;align-items:center;min-height:66px;padding:11px 14px;border-radius:18px;background:var(--card);border:1px solid var(--card-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .row .t{font-size:14px;font-weight:700}
  .row .s{font-size:12px;color:var(--muted);margin-top:4px}
  .row .r{text-align:right;flex-shrink:0;padding-left:8px}
  .row .v{font-size:16px;font-weight:800}
  .pill{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}
  .pill.wait{color:var(--amber);background:var(--amber-bg)}
  .pill.ok{color:var(--green);background:var(--ok-bg)}
  .row{cursor:pointer;gap:12px}
  .row .l{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.2px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .bt{width:var(--sz,40px);height:var(--sz,40px);border-radius:calc(var(--sz,40px)*.3);background:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .bt svg{width:62%;height:62%}
  .bt.caf b{font:900 calc(var(--sz,40px)*.36)/1 -apple-system,"Inter",sans-serif;color:#0d4f9e;letter-spacing:-.5px}
  .bt.caf b i{font-style:normal;color:#e4007d}
  .services{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .svc{grid-column:span 1;display:flex;align-items:center;gap:10px;min-height:66px;padding:11px 12px;border-radius:18px;background:var(--card);border:1px solid var(--card-line);color:#fff;font:inherit;text-align:left;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
  .svc:active{transform:scale(.98)}
  .svc .bt{--sz:34px}
  .svc .tx{min-width:0;flex:1}
  .svc .n{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .svc .m{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .svc.big{grid-column:1/-1;padding:11px 14px;gap:12px}
  .svc.big .bt{--sz:38px}
  .svc.big .n{font-size:14px}.svc.big .m{font-size:12px;white-space:normal}
  .stack{display:flex;flex-shrink:0}.stack .bt{--sz:30px;margin-right:-8px;border:2px solid #121a2e}.stack .bt:last-child{margin-right:0}
  .pill.late{color:#ff9b9b;background:rgba(255,107,107,.16)}
  .pill.watch{color:#9fc3ff;background:rgba(95,168,255,.13)}
  .pill.new{color:#06291c;background:var(--green)}
  .pill.ready{color:#cfe0ff;background:rgba(95,168,255,.2)}
  .view{display:block}
  .sheet-bg{position:fixed;inset:0;background:rgba(2,5,12,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;width:var(--app-w,100%);height:74vh;transform:translate(-50%,105%);z-index:21;display:flex;flex-direction:column;
    border-radius:28px 28px 0 0;border:1px solid rgba(255,255,255,.1);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.5);
    background:radial-gradient(120% 50% at 85% 100%,rgba(13,90,62,.4),transparent 70%),linear-gradient(180deg,#14275a 0%,#0b1633 30%,#060b18 100%);
    transition:transform .38s cubic-bezier(.2,.9,.25,1),height .32s cubic-bezier(.2,.9,.25,1),border-radius .32s}
  .sheet.open{transform:translate(-50%,0)}
  .sheet.full{height:100vh;height:100dvh;border-radius:0}
  .grab{flex-shrink:0;display:grid;place-items:center;height:22px;cursor:grab;touch-action:none}
  .grab span{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
  .sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 17px calc(env(safe-area-inset-bottom) + 28px)}
  .sheet.full .grab{height:calc(env(safe-area-inset-top) + 22px);align-items:end}
  body.lock{overflow:hidden}
  .sbody>.top{position:sticky;top:-4px;z-index:3;margin:0 -17px;padding:6px 17px 10px;background:rgba(12,24,56,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .top{display:flex;align-items:center;gap:12px}
  .back{width:42px;height:42px;border-radius:50%;background:rgba(10,16,32,.55);border:1px solid rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;font:inherit}
  .top .bt{--sz:46px}
  .top .gl{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--a);background:color-mix(in srgb,var(--a) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 40%,transparent)}
  .top .ttl{font-size:20px;font-weight:800}.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card{margin-top:12px;border-radius:20px;padding:16px;background:var(--card);border:1px solid var(--card-line)}
  .card.news{background:linear-gradient(160deg,rgba(31,167,116,.22),rgba(31,167,116,.06));border-color:rgba(95,227,166,.3)}
  .card.auto{background:linear-gradient(160deg,rgba(40,66,135,.55),rgba(22,36,78,.45));border-color:var(--hero-line)}
  .tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--green);margin-bottom:6px}
  .card h3{font-size:15.5px;font-weight:800;line-height:1.3}
  .card p{font-size:13px;color:var(--muted2);margin-top:6px;line-height:1.45}
  .docs{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .docs li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);font-size:13px}
  .docs li button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:6px 11px;background:#fff;color:#0a0f1d;cursor:pointer;flex-shrink:0}
  .docs li.done button{background:var(--ok-bg);color:var(--green)}
  .cta{margin-top:14px;width:100%;height:48px;border:0;border-radius:999px;background:var(--mic);color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
  .cta:disabled{opacity:.45}
  .fine{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px}
  .opt:first-of-type{border-top:0}
  .opt small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .opt b{color:var(--green);font-size:13px;white-space:nowrap}
  .empty{font-size:13px;color:var(--muted)}
  /* ---- Démo des modes d'affichage ---- */
  .phone{padding-bottom:110px}
  .sheet.fit{height:auto;max-height:92vh;max-height:92dvh}
  .sheet.full{height:100vh;height:100dvh;max-height:none;border-radius:0}
  .hint{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12.5px;color:#cfe0ff;background:rgba(95,168,255,.12);border:1px solid rgba(95,168,255,.25);border-radius:14px;padding:10px 12px;line-height:1.4}
  .hint b{color:#fff}
  .all{margin-top:12px;width:100%;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .morph{position:fixed;z-index:22;overflow:hidden;border:1px solid var(--card-line);border-radius:18px;
    background:radial-gradient(120% 50% at 85% 100%,rgba(13,90,62,.4),transparent 70%),linear-gradient(180deg,#14275a 0%,#0b1633 30%,#060b18 100%);
    transition:top .42s cubic-bezier(.2,.9,.25,1),left .42s cubic-bezier(.2,.9,.25,1),width .42s cubic-bezier(.2,.9,.25,1),height .42s cubic-bezier(.2,.9,.25,1),border-radius .42s}
  .morph.big{border-radius:0;border-color:transparent}
  .morph.half{border-radius:28px 28px 0 0;border-color:rgba(255,255,255,.1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  .morph .grab{position:absolute;top:0;left:0;right:0;z-index:4}
  .mbody.half{padding:22px 17px 0}
  .mbody{padding-bottom:0}
  .mbody::after{content:"";display:block;height:calc(env(safe-area-inset-bottom) + 20px)}
  .mbody:has(.actbar)::after{display:none}
  .actbar{position:sticky;bottom:0;z-index:3;margin:14px -17px 0;padding:12px 17px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(180deg,rgba(6,11,24,0),rgba(6,11,24,.92) 26%,#060b18)}
  .actbar .cta{margin-top:0}
  .actbar .all{margin-top:8px;height:38px;border:0;background:none;color:#9fc3ff}
  .morph.big{border-radius:28px 28px 0 0;border-color:rgba(255,255,255,.1)}
  .steps{list-style:none;margin-top:4px}
  .steps li{position:relative;padding:0 0 14px 26px;font-size:13.5px}
  .steps li:last-child{padding-bottom:0}
  .steps li::before{content:"";position:absolute;left:4px;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
  .steps li.ok::before{background:var(--green);border-color:var(--green)}
  .steps li:not(:last-child)::after{content:"";position:absolute;left:9px;top:17px;bottom:2px;width:2px;background:rgba(255,255,255,.12)}
  .steps li.ok:not(:last-child)::after{background:rgba(95,227,166,.5)}
  .steps small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .big-amt{font-size:34px;font-weight:900;letter-spacing:-.8px;margin-top:4px}
  .big-amt.ok{color:var(--green)}
  .cd{margin-top:12px;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--card-line)}
  .cd .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted2)}
  .cd .l1 b{font-size:18px;color:#fff}
  .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),#9fe8c4)}
  .cd.late{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3)}
  .cd.late .l1 b{color:#ff9b9b}.cd.late .bar i{background:#ff7b7b}
  .lettre{margin-top:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--card-line)}
  .lettre summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:700;color:#9fc3ff}
  .lettre summary::-webkit-details-marker{display:none}
  .lettre div{padding:0 14px 14px;font-size:12.5px;line-height:1.55;color:var(--muted2);white-space:pre-line}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .kv div{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.05)}
  .kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kv b{display:block;font-size:14px;margin-top:3px}
  .spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--green);animation:sp 1s linear infinite;margin:18px auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .chxs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .chx{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:14.5px;font-weight:700;text-align:left;cursor:pointer}
  .chx:active{transform:scale(.98);background:rgba(255,255,255,.12)}
  .chx svg{flex-shrink:0;color:rgba(255,255,255,.45)}
  .docs li .aide{background:none;color:#9fc3ff;padding:6px 0 0;flex-basis:100%;text-align:left}
  .docs li .aide:empty{display:none}
  .aidetx{flex-basis:100%;color:#cfe0ff;font-size:12px;line-height:1.45;margin-top:6px}
  .pin{margin-top:8px;height:42px;border-radius:12px;border:1px solid var(--card-line);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:14px;padding:0 12px}
  .demo{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:#ffd57a;background:rgba(241,194,74,.14);border:1px solid rgba(241,194,74,.3);border-radius:999px;padding:3px 9px}
  .h2d{display:flex;align-items:baseline;gap:8px}.h2d h2{margin-right:0}.h2d .ex{font-size:11.5px;font-weight:600;color:var(--muted)}
  .pmsg{flex-basis:100%;font-size:12px;line-height:1.45;margin-top:6px;color:var(--muted2)}
  .pmsg.refuse{color:#ff9b9b}.pmsg.a_confirmer{color:#ffd57a}
  .pbt{flex-basis:100%;margin-top:6px}.pbt button{background:rgba(255,255,255,.12)!important;color:#fff!important}
  .exf{flex-basis:100%;margin:8px 0 0;cursor:zoom-in}.exf svg{display:block;width:100%;height:auto;border-radius:10px}
  .exf figcaption{font-size:11.5px;color:var(--muted2);line-height:1.45;margin-top:6px}
  .exf.grand{position:fixed;inset:0;z-index:40;margin:0;padding:calc(env(safe-area-inset-top) + 24px) 12px 24px;background:rgba(2,5,12,.94);display:flex;flex-direction:column;justify-content:center;cursor:zoom-out}
  .exf.grand figcaption{font-size:13px;color:#dfe6f3}
  /* actions des fenêtres de dossier — limitées aux fenêtres pour ne pas toucher la rangée « Parler à l’IA / Scanner » de l’accueil */
  .mbody .actions,.sbody .actions{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  #resume .cta{margin-top:12px}
  .ctx{padding:10px 14px}.kvl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
  .kvl+.kvl{border-top:1px solid rgba(255,255,255,.08)}
  .kvl small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kvl b{display:block;font-size:13.5px;margin-top:2px}
  .lien{background:none;border:0;color:#9fc3ff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
  .aides{flex-basis:100%;display:flex;gap:14px;flex-wrap:wrap}.aides .aide{flex-basis:auto!important}
  .opt2{margin-top:12px}.opt2 summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted2);list-style:none}
  .opt2 summary::-webkit-details-marker{display:none}
  .trj{padding:6px 0}.trj small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.trj .fld{grid-template-columns:1fr 1fr;margin-top:6px}.trj .fld input:last-child{grid-column:1/-1}

  .frise li{font-size:10.5px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border-radius:999px;padding:3px 8px}
  .frise li.ok{color:#bfeedd;background:rgba(95,227,166,.12)}.frise li.cur{color:#06291c;background:var(--green)}
  .explorer{margin-top:4px;height:40px}
  .maj{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}
  .horsligne{margin:14px 0 -6px;padding:9px 12px;border-radius:14px;font-size:12.5px;color:#ffd57a;background:rgba(241,194,74,.12);border:1px solid rgba(241,194,74,.3)}
  .center{text-align:center;color:var(--muted2);font-size:13.5px}
  .fld{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .fld input{width:100%;height:44px;border-radius:12px;border:1px solid var(--card-line);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:14px;padding:0 12px}
  .fld input::placeholder{color:#7f8aa3}
  .micbig{width:74px;height:74px;border-radius:50%;margin:14px auto 8px;display:grid;place-items:center;background:var(--mic-ring)}

  .micbig.on{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(31,167,116,.12)}}
  .bulle{margin-top:10px;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45;max-width:88%}
  .bulle.moi{margin-left:auto;background:#fff;color:#0a0f1d;border-bottom-right-radius:5px}
  .bulle.ia{background:rgba(255,255,255,.07);border:1px solid var(--card-line);border-bottom-left-radius:5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chips button{border:1px solid var(--card-line);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:7px 11px;cursor:pointer}
  .ask{display:flex;gap:8px;margin-top:4px}
  .ask input{flex:1;height:46px;border-radius:999px;border:1px solid var(--card-line);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:14px;padding:0 16px}
  .ask button{width:46px;height:46px;border-radius:50%;border:0;background:var(--mic);color:#fff;display:grid;place-items:center;cursor:pointer}
  .mbody.half>.top{position:static}
  .mbody:not(.half)>.top{position:sticky;top:-18px;z-index:3;margin:0 -17px;padding:6px 17px 10px;background:rgba(12,24,56,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .mbody{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 17px 40px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
  .mbody.on{opacity:1;transform:none}
  .fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.9,.25,1),margin .35s;grid-column:1/-1;margin-top:-9px}
  .fold.on{grid-template-rows:1fr;margin-top:0}
  .fold>div{overflow:hidden}
  .fold .in{margin-top:-4px;border-radius:0 0 18px 18px;border:1px solid var(--card-line);border-top:0;background:rgba(255,255,255,.035);padding:6px 14px 14px}
  .row.opened,.svc.opened{border-bottom-left-radius:6px;border-bottom-right-radius:6px;background:rgba(255,255,255,.08)}
  .fold .docs{margin-top:8px}.fold .cta{margin-top:10px;height:44px}.fold .all{height:38px;margin-top:8px}
  .fold .opt:first-of-type{border-top:0}
  .island{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-140%);z-index:25;width:236px;min-height:38px;border-radius:22px;background:#000;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.6);
    transition:transform .45s cubic-bezier(.2,1.2,.3,1),width .4s cubic-bezier(.2,1,.3,1),border-radius .4s,padding .4s;padding:5px 12px 5px 6px;cursor:pointer;overflow:hidden}
  .island.show{transform:translate(-50%,0)}
  .island.big{width:min(calc(100% - 16px),359px);border-radius:30px;padding:14px;cursor:default}
  .island .mini{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .island .mini .bt{--sz:26px;border-radius:50%}
  .island .mini .v{margin-left:auto;color:var(--green)}
  .island .mini .tx{overflow:hidden;text-overflow:ellipsis}
  .island .more{display:none}
  .island.big .mini{font-size:14px}.island.big .mini .bt{--sz:34px}
  .island.big .more{display:block}
  .island p{font-size:13.5px;color:#d5dbe7;line-height:1.45;margin:10px 2px 12px}
  .island .bts{display:flex;gap:8px}
  .island .bts button{flex:1;height:42px;border-radius:999px;border:0;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .island .go{background:var(--mic);color:#fff}.island .no{background:rgba(255,255,255,.12);color:#fff}
  .island .lnk{display:block;margin:10px auto 0;background:none;border:0;color:#9fc3ff;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .modes{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:19;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(20,26,42,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .modes[hidden]{display:none}
  .modes button{border:0;background:none;color:#aeb7c9;font:inherit;font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .modes button.on{background:#fff;color:#0a0f1d}
  .modes .lb{font-size:10px;font-weight:800;color:#7f8aa3;text-transform:uppercase;letter-spacing:.6px;align-self:center;padding:0 6px 0 8px}
